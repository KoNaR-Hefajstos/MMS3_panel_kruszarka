# Enable the console subsystem
CONFIG_CONSOLE=y
CONFIG_I2C=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Optional: Enable full logging system if you want to use LOG_INF() macros
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MMS_CHAINBUS=y
CONFIG_GPIO_PCA_SERIES=y
CONFIG_GPIO_PCA_SERIES_INIT_PRIORITY=61

CONFIG_RTC=y
